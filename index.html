<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0b1020">
<title>Training</title>
<style>
:root{--bg:#0b1020;--card:#141a2e;--card2:#1c2440;--line:#26304f;--text:#eef1f8;--muted:#8d97b5;--accent:#5eead4;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 4px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:24px}
main{padding:0 12px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#1e3a5f,#3b2a6b);border:0}
.clock{font-size:46px;font-weight:800;letter-spacing:1px;margin:2px 0}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
h2,h3{margin:0 0 6px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;color:var(--text);background:var(--card2);cursor:pointer}
button:disabled{opacity:.35}
.btn{font:inherit;border-radius:12px;color:var(--text);background:var(--card2);display:inline-block;cursor:pointer}
.primary{background:linear-gradient(135deg,#14b8a6,#8b5cf6);color:#fff;font-weight:700;width:100%;padding:15px;font-size:17px}
.row .primary{width:auto}
.sm{padding:9px 13px;font-size:14px}
.xs{padding:6px 10px;font-size:13px;border-radius:9px}
.danger{color:var(--bad)}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;margin:8px 0;padding:16px;font-size:17px;font-weight:600;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);text-align:left}
.big span{color:var(--muted);font-weight:400;font-size:14px}
.tag{display:inline-block;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(0,0,0,.25);color:var(--ok)}
.ex{border-left:5px solid var(--c)}
.ex.done{border-left-color:var(--ok);background:#12261f}
.exname{display:block;font-size:17px;font-weight:700;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;margin-top:8px}
.form{color:var(--accent);text-decoration:none;font-size:14px;white-space:nowrap}
.last{font-size:13px;color:var(--warn);margin:6px 0}
.set{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea.note{font-size:15px;min-height:44px;resize:vertical;margin-top:10px}
.chk{padding:10px 0;font-size:18px;color:#55607f}
.chk.on{background:var(--ok);color:#06281c}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border-bottom:0}
.hist>span:last-child{text-align:right;color:#c9cfe2}
.hist a{color:var(--accent);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.tools{display:flex;gap:6px;flex-shrink:0}
summary{cursor:pointer;font-size:15px}
.chart{width:100%;margin-top:10px}
.chart text{fill:var(--muted);font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1528;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:9px 0 11px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--accent);font-weight:700}
p{margin:4px 0;line-height:1.45}
.chkline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:10px}
.chkline input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
label.muted input{margin-top:4px}
</style>
</head>
<body>
<header><h1>Training</h1><button class="xs" id="gear">⚙︎ Settings</button></header>
<main id="view"></main>
<nav>
  <button data-tab="home"><i>⌂</i>Home</button>
  <button data-tab="today"><i>◉</i>Workout</button>
  <button data-tab="history"><i>☰</i>History</button>
  <button data-tab="progress"><i>↗</i>Progress</button>
  <button data-tab="plan"><i>✎</i>Plan</button>
</nav>
<script>
const DEFAULT_PROGRAM = {
  v: 2,
  name: "Block 1: Rebuild",
  start: "2026-10-26",
  layout: [["Mon","Day 1: Lower A"],["Tue","Day 2: Upper A"],["Wed","Day 5: Core and Arms (5 day weeks)"],["Thu","Day 3: Lower B"],["Fri","Day 4: Upper B"],["Sat and Sun","Padel or basketball"]],
  weeks: [
    {w:1, dates:"Oct 26 to Oct 30", sets:2, focus:"2 sets per exercise, light weights. Learn the movements and check how your knee and shoulders feel the next day."},
    {w:2, dates:"Nov 2 to Nov 6", focus:"Full 3 sets, same weights as week 1."},
    {w:3, dates:"Nov 9 to Nov 13", focus:"Add a little weight (about 5 to 10%) on anything that felt easy."},
    {w:4, dates:"Nov 16 to Nov 20", focus:"Add weight or 2 reps per set. Try 4 sets on hip thrusts and rows."}
  ],
  days: [
    {id:"d1", name:"Day 1: Lower A", when:"Monday", color:"#2dd4bf", exercises:[
      {name:"Bike warm up", sets:1, reps:"5 to 8 min", note:"Easy pace", cardio:true, alts:["Incline walk","Elliptical"]},
      {name:"Hip thrust", sets:3, reps:"10", note:"Upper back on bench, chin tucked, drive through heels", alts:["Hip thrust machine","Dumbbell glute bridge"]},
      {name:"Dumbbell Romanian deadlift", sets:3, reps:"10", note:"Hips back, soft knees, flat back, stop at mid shin", alts:["Cable pull through","Back extension"]},
      {name:"Seated leg curl", sets:3, reps:"12", note:"Slow lowering", alts:["Lying leg curl","Stability ball leg curl"]},
      {name:"Leg press (short range)", sets:3, reps:"12", note:"Feet high, stop around 90 degrees at the knee", alts:["Leg extension (light)","Glute bridge"]},
      {name:"Hip abduction machine", sets:3, reps:"15", note:"Sit tall, push out with control", alts:["Seated band abduction","Banded side steps"]},
      {name:"Calf raise", sets:3, reps:"15", note:"Full stretch, pause at the top", alts:["Leg press calf raise","Standing dumbbell calf raise"]},
      {name:"Reverse crunch", sets:3, reps:"12", note:"Curl hips toward chest, lower slowly", alts:["Dead bug","Hollow body hold"]}
    ]},
    {id:"d2", name:"Day 2: Upper A", when:"Tuesday", color:"#a78bfa", exercises:[
      {name:"Band pull aparts", sets:2, reps:"15", note:"Warm up, arms straight", alts:["Light face pulls"]},
      {name:"Lat pulldown (neutral grip)", sets:3, reps:"10", note:"To upper chest, never behind the neck", alts:["Assisted pull up","Single arm cable pulldown"]},
      {name:"Seated cable row", sets:3, reps:"12", note:"Chest up, squeeze shoulder blades", alts:["Chest supported row","Machine row"]},
      {name:"Machine chest press (neutral grip)", sets:3, reps:"10", note:"Elbows tucked, stop at chest level", alts:["Dumbbell floor press","Push ups"]},
      {name:"Face pulls", sets:3, reps:"15", note:"Light, rope to forehead, elbows high", alts:["Band face pulls","Band pull aparts"]},
      {name:"Cable external rotation", sets:3, reps:"12 per arm", note:"Very light, elbow pinned to your side", alts:["Band external rotation","Side lying dumbbell external rotation"]},
      {name:"Dumbbell curl", sets:3, reps:"12", note:"Elbows still, no swinging", alts:["Cable curl","EZ bar curl"]},
      {name:"Rope triceps pushdown", sets:3, reps:"12", note:"Spread the rope at the bottom", alts:["Straight bar pushdown","Dumbbell kickback"]}
    ]},
    {id:"d5", name:"Day 5: Core and Arms", when:"Wednesday", color:"#fbbf24", exercises:[
      {name:"Farmer's carry", sets:4, reps:"30 to 40 m", note:"Stand tall, shoulders back and down", alts:["Suitcase carry","Trap bar carry"]},
      {name:"Face pulls", sets:3, reps:"15", note:"Light, strict form", alts:["Band face pulls"]},
      {name:"Cable external rotation", sets:2, reps:"12 per arm", note:"Very light", alts:["Band external rotation"]},
      {name:"Incline dumbbell curl", sets:3, reps:"12", note:"Arms hang straight down behind your body", alts:["Preacher curl","Cable curl"]},
      {name:"Rope triceps pushdown", sets:3, reps:"12", note:"Spread the rope at the bottom", alts:["Straight bar pushdown","Dumbbell kickback"]},
      {name:"Hanging knee raise", sets:3, reps:"10", note:"Curl your pelvis up, no swinging", alts:["Captain's chair knee raise","Reverse crunch"]},
      {name:"Cable crunch", sets:3, reps:"12", note:"Round your spine down, hips still", alts:["Machine crunch","Crunch on mat"]},
      {name:"Plank", sets:3, reps:"30 sec", note:"Straight line, squeeze glutes. Log seconds in the reps box", alts:["Hollow body hold","Bird dog"]}
    ]},
    {id:"d3", name:"Day 3: Lower B", when:"Thursday", color:"#34d399", exercises:[
      {name:"Incline walk warm up", sets:1, reps:"5 to 8 min", note:"Easy pace", cardio:true, alts:["Bike warm up","Elliptical"]},
      {name:"Back extension", sets:3, reps:"12", note:"Hinge at the hips, stop at a straight line", alts:["Dumbbell Romanian deadlift","Reverse hyper"]},
      {name:"Cable pull through", sets:3, reps:"12", note:"Face away from the cable, hinge back, snap hips forward", alts:["Kettlebell Romanian deadlift","Glute bridge"]},
      {name:"Lying leg curl", sets:3, reps:"12", note:"Hips pressed into the pad", alts:["Seated leg curl","Stability ball leg curl"]},
      {name:"Single leg glute bridge", sets:3, reps:"10 per side", note:"Hips level", alts:["Glute bridge","Hip thrust machine"]},
      {name:"Cable glute kickback", sets:3, reps:"12 per side", note:"Small controlled kick, no lower back arch", alts:["Glute kickback machine","Banded kickback"]},
      {name:"Side plank", sets:3, reps:"20 to 30 sec per side", note:"Hips lifted. Log seconds in the reps box", alts:["Side plank on knees","Suitcase carry"]},
      {name:"Pallof press", sets:3, reps:"10 per side", note:"Press straight out, resist the rotation", alts:["Band Pallof press","Bird dog"]}
    ]},
    {id:"d4", name:"Day 4: Upper B", when:"Friday", color:"#818cf8", exercises:[
      {name:"Band pull aparts", sets:2, reps:"15", note:"Warm up, arms straight", alts:["Light face pulls"]},
      {name:"Chest supported row", sets:3, reps:"10", note:"Chest on an incline bench, pull elbows back", alts:["Seated cable row","One arm dumbbell row"]},
      {name:"Assisted pull up", sets:3, reps:"8", note:"Log the assistance weight", alts:["Close grip pulldown","Lat pulldown (neutral grip)"]},
      {name:"Push ups", sets:3, reps:"8 to 12", note:"Hands on a bench if needed, body straight", alts:["Machine chest press (neutral grip)","Dumbbell floor press"]},
      {name:"Straight arm cable pulldown", sets:3, reps:"12", note:"Arms nearly straight, sweep down to thighs", alts:["Band straight arm pulldown"]},
      {name:"Face pulls", sets:3, reps:"15", note:"Light, strict form", alts:["Band face pulls"]},
      {name:"Hammer curl", sets:3, reps:"12", note:"Palms facing each other", alts:["Rope cable curl","Cross body curl"]},
      {name:"Lying dumbbell triceps extension", sets:3, reps:"12", note:"Elbows point to the ceiling", alts:["EZ bar skull crusher","Rope triceps pushdown"]}
    ]}
  ],
  notes: [
    {title:"3 or 4 day weeks", text:"4 days: skip Wednesday. 3 days: Day 1 Monday, Day 2 Wednesday, then alternate Day 3 and Day 4 on Fridays. Missed a day? Slide the week forward and drop Day 5."},
    {title:"Joint safety", text:"Leave 2 or 3 reps in the tank. Muscle soreness is fine, but sharp pain, pinching, or pain inside the joint means stop that exercise for the day. If something feels worse the next morning, drop the weight next session. No squats, lunges, overhead pressing, flies, upright rows, or dips."},
    {title:"Mondays after the weekend", text:"If your knee is sore from padel or basketball, lighten the leg press and RDLs or swap the leg press for an extra set of hip thrusts."},
    {title:"Weekend games", text:"Warm up 10 minutes first: light jog, side shuffles, glute bridges, leg swings. Keep it moderate for the first few weekends, avoid hard landings, and consider a knee sleeve."},
    {title:"Nutrition and recovery", text:"Protein about 1.6 to 2.2 g per kg of body weight daily, eaten first at meals. Water plus electrolytes on training and game days. Sleep 7 to 9 hours. Optional creatine 3 to 5 g daily. Tell your prescriber if you feel unusually tired or lightheaded during training."},
    {title:"Tracking", text:"Progress photos and a waist measurement at the start and end of each block. If your lifts hold or rise while the scale drops, you are keeping muscle."}
  ]
};

const KEY = "berhanTraining.v1";
const clone = o => JSON.parse(JSON.stringify(o));
let S = load(), tab = "home", progEx = "", addOpen = false, planAdd = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const formUrl = n => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(n + " exercise proper form");
const pad = n => String(n).padStart(2, "0");

function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!s || !s.program) s = {program: clone(DEFAULT_PROGRAM), sessions: [], unit: "lb", draft: null};
  if (!s.program.v || s.program.v < 2){ s.program = clone(DEFAULT_PROGRAM); s.draft = null; }
  s.notes = s.notes || {}; s.sessions = s.sessions || []; s.unit = s.unit || "lb";
  return s;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function localISO(d){ d = new Date(d); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
const todayISO = () => localISO(new Date());
function mondayISO(){ const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return localISO(d); }
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const fmtT = t => { if (!t) return ""; const [h,m] = t.split(":").map(Number); return ((h % 12) || 12) + ":" + pad(m) + (h >= 12 ? " PM" : " AM"); };
const mins = (a,b) => { if (!a || !b) return 0; const [x,y] = a.split(":").map(Number), [p,q] = b.split(":").map(Number); let d = (p*60+q) - (x*60+y); if (d < 0) d += 1440; return d; };
const fmtDur = m => m >= 60 ? Math.floor(m/60) + "h " + pad(m % 60) + "m" : m + " min";
const clockStr = () => new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const longDate = () => new Date().toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
const dayOf = id => S.program.days.find(d => d.id === id);
const colorOf = id => (dayOf(id) || {}).color || "#5eead4";

function weekInfo(){
  const p = S.program, start = new Date(p.start + "T00:00");
  const n = Math.floor((new Date() - start) / (7 * 864e5)) + 1;
  return {n, w: (p.weeks || []).find(x => x.w === n)};
}
function sorted(){ return [...S.sessions].sort((a,b) => a.date.localeCompare(b.date) || a.id - b.id); }
function lastFor(name){
  const list = sorted();
  for (let i = list.length - 1; i >= 0; i--){
    const e = list[i].entries.find(x => x.name === name && !x.cardio);
    if (e){ const sets = e.sets.filter(s => s.w || s.r); if (sets.length) return {date: list[i].date, sets}; }
  }
  return null;
}
function allNames(){
  const set = new Set();
  S.program.days.forEach(d => d.exercises.forEach(e => { set.add(e.name); (e.alts || []).forEach(a => set.add(a)); }));
  S.sessions.forEach(s => s.entries.forEach(e => set.add(e.name)));
  ["Leg extension (light)","Cable crunch","Hip thrust machine","Glute kickback machine"].forEach(n => set.add(n));
  return [...set].sort();
}
function nextDay(){
  const order = ["d1","d2","d3","d4"].filter(id => dayOf(id));
  if (!order.length) return S.program.days[0].id;
  const last = sorted().reverse().find(s => order.includes(s.dayId));
  return last ? order[(order.indexOf(last.dayId) + 1) % order.length] : order[0];
}
function fill(name, n){
  const last = lastFor(name);
  return Array.from({length: n}, (_, k) => ({w: last && last.sets[k] ? last.sets[k].w : "", r: "", done: false}));
}
function makeEntry(x, w){
  const n = x.cardio ? 1 : (w && w.sets ? Math.min(w.sets, x.sets) : x.sets);
  return {base: x.name, name: x.name, alts: x.alts || [], target: (x.cardio ? "" : n + " x ") + x.reps, note: x.note || "", cardio: !!x.cardio, sets: fill(x.name, n)};
}
function move(arr, i, j){ if (j < 0 || j >= arr.length) return; const [it] = arr.splice(i, 1); arr.splice(j, 0, it); }

function startDay(id){
  const d = dayOf(id), {w} = weekInfo();
  S.draft = {dayId: id, dayName: d.name, date: todayISO(), checkIn: nowHM(), entries: d.exercises.map(x => makeEntry(x, w))};
  addOpen = false; save(); tab = "today"; render(); scrollTo(0,0);
}
function finish(){
  const dr = S.draft;
  const done = dr.entries.filter(e => e.sets.some(s => s.done || s.w || s.r)).length;
  S.sessions.push({id: Date.now(), date: dr.date, dayId: dr.dayId, dayName: dr.dayName, checkIn: dr.checkIn, checkOut: nowHM(),
    completed: done + "/" + dr.entries.length,
    entries: dr.entries.map(e => ({name: e.name, cardio: e.cardio, sets: e.sets, note: S.notes[e.name] || ""}))});
  S.draft = null; save(); tab = "history"; render(); scrollTo(0,0);
}

function renderHome(){
  const {n, w} = weekInfo(), mon = mondayISO();
  const wk = S.sessions.filter(s => s.date >= mon);
  const wkMin = wk.reduce((a,s) => a + mins(s.checkIn, s.checkOut), 0);
  const nx = nextDay(), recent = sorted().reverse().slice(0, 3);
  let h = `<div class="card hero"><div class="muted" id="hdate" style="color:#cdd6f4">${esc(longDate())}</div><div class="clock" id="hclock">${esc(clockStr())}</div>`;
  h += S.draft
    ? `<span class="tag">● At the gym since ${esc(fmtT(S.draft.checkIn))}</span><div class="row"><button class="primary" data-go="today">Continue ${esc(S.draft.dayName)}</button></div>`
    : `<div class="row"><button class="primary" data-start="${nx}">Check in: ${esc(dayOf(nx).name)}</button></div><div class="muted" style="margin-top:8px;color:#cdd6f4">Doing something else today? Pick it in the Workout tab.</div>`;
  h += `</div><div class="card"><div class="row between nowrap" style="margin:0"><b>This week</b><span class="muted">${w ? "Week " + n + " of " + S.program.weeks.length : ""}</span></div>
    <div class="stats"><div class="stat"><b>${wk.length}</b><span class="muted">workouts</span></div><div class="stat"><b>${fmtDur(wkMin)}</b><span class="muted">in the gym</span></div><div class="stat"><b>${S.sessions.length}</b><span class="muted">all time</span></div></div>
    ${w ? `<p class="muted" style="margin-top:10px">${esc(w.focus)}</p>` : ""}</div>`;
  if (recent.length){
    h += `<div class="card"><b>Recent</b>` + recent.map(s => `<div class="hist"><span><span style="color:${colorOf(s.dayId)}">●</span> ${esc(s.dayName)}<br><small class="muted">${esc(s.date)}${s.checkIn ? " · " + esc(fmtT(s.checkIn)) + " to " + esc(fmtT(s.checkOut)) : ""}</small></span><span>${s.checkIn ? fmtDur(mins(s.checkIn, s.checkOut)) : ""}</span></div>`).join("") + `</div>`;
  }
  $("#view").innerHTML = h;
}

function renderToday(){
  const {n, w} = weekInfo(), p = S.program;
  if (!S.draft){
    $("#view").innerHTML = `<div class="card"><b>${esc(p.name)}</b><div class="muted">${w ? "Week " + n + " (" + esc(w.dates) + "): " + esc(w.focus) : n < 1 ? "Starts " + esc(p.start) : "Block finished. Load next month's program in Settings."}</div></div>
      <div class="muted" style="padding:6px 4px">Pick a workout to check in</div>` +
      p.days.map(d => `<button class="big" style="--c:${d.color || "#5eead4"}" data-start="${d.id}">${esc(d.name)}<span>${esc(d.when || "")}</span></button>`).join("");
    return;
  }
  const dr = S.draft, c = colorOf(dr.dayId);
  let h = `<div class="card" style="border-left:6px solid ${c}"><div class="row between nowrap" style="margin:0"><h2 style="margin:0">${esc(dr.dayName)}</h2><button class="xs danger" data-act="cancel">Discard</button></div>
    <div class="grid2"><label class="muted">Checked in<input type="time" value="${esc(dr.checkIn)}" data-ci="1"></label><div class="stat"><span class="muted">Time in gym</span><b id="elapsed">${fmtDur(mins(dr.checkIn, nowHM()))}</b></div></div></div>`;
  dr.entries.forEach((e, i) => {
    const opts = [e.base, ...e.alts]; if (!opts.includes(e.name)) opts.push(e.name);
    const last = lastFor(e.name), allDone = e.sets.length && e.sets.every(s => s.done);
    h += `<div class="card ex ${allDone ? "done" : ""}" style="--c:${c}">
      <div class="row between nowrap" style="margin:0"><span class="muted">${i + 1} of ${dr.entries.length} · ${esc(e.target)}</span>
        <div class="tools"><button class="xs" data-up="${i}" ${i ? "" : "disabled"}>↑</button><button class="xs" data-down="${i}" ${i < dr.entries.length - 1 ? "" : "disabled"}>↓</button><button class="xs danger" data-x="${i}">✕</button></div></div>
      ${opts.length > 1
        ? `<select class="exname" data-alt="${i}">${opts.map((o, k) => `<option value="${esc(o)}" ${o === e.name ? "selected" : ""}>${k ? "Alt: " : ""}${esc(o)}</option>`).join("")}</select>`
        : `<div class="exname">${esc(e.name)}</div>`}
      <div class="row between nowrap"><span class="muted">${esc(e.name === e.base ? e.note : "Alternative for " + e.base)}</span><a class="form" target="_blank" href="${formUrl(e.name)}">Form ↗</a></div>
      ${last ? `<div class="last">Last (${esc(last.date)}): ${last.sets.map(s => esc(s.w || 0) + S.unit + " x " + esc(s.r || 0)).join(", ")}</div>` : ""}
      ${e.cardio
        ? `<div class="row"><button class="chk ${e.sets[0].done ? "on" : ""}" style="width:100%" data-done="${i}:0">${e.sets[0].done ? "Done ✓" : "Mark done"}</button></div>`
        : e.sets.map((s, j) => `<div class="set"><span class="muted">${j + 1}</span>
            <input inputmode="decimal" placeholder="${S.unit}" value="${esc(s.w)}" data-e="${i}" data-s="${j}" data-f="w">
            <input inputmode="numeric" placeholder="reps" value="${esc(s.r)}" data-e="${i}" data-s="${j}" data-f="r">
            <button class="chk ${s.done ? "on" : ""}" data-done="${i}:${j}">✓</button></div>`).join("") +
          `<div class="row"><button class="xs" data-add="${i}">+ Set</button>${e.sets.length > 1 ? `<button class="xs" data-rm="${i}">Remove set</button>` : ""}</div>`}
      <textarea class="note" placeholder="Note for next time..." data-note="${esc(e.name)}">${esc(S.notes[e.name] || "")}</textarea>
    </div>`;
  });
  h += addOpen
    ? `<div class="card"><h3>Add exercise</h3><input id="nxName" list="exlist" placeholder="Exercise name, e.g. Leg extension"><datalist id="exlist">${allNames().map(x => `<option value="${esc(x)}">`).join("")}</datalist>
        <div class="grid2"><label class="muted">Sets<input id="nxSets" type="number" inputmode="numeric" value="3"></label><label class="muted">Reps<input id="nxReps" value="10"></label></div>
        <label class="chkline"><input type="checkbox" id="nxSave"> Also add it to ${esc(dr.dayName)} in my plan</label>
        <div class="row"><button class="primary sm" data-act="addex">Add</button><button class="sm" data-act="addcancel">Cancel</button></div></div>`
    : `<button class="sm" style="width:100%;margin:6px 0" data-act="addopen">+ Add an exercise</button>`;
  h += `<button class="primary" style="margin-top:8px" data-act="finish">Finish and check out</button>`;
  $("#view").innerHTML = h;
}

function renderHistory(){
  const list = sorted().reverse();
  if (!list.length){ $("#view").innerHTML = `<div class="card muted">No workouts logged yet. Finish one and it shows up here.</div>`; return; }
  $("#view").innerHTML = list.map(s => `<details class="card" style="border-left:6px solid ${colorOf(s.dayId)}">
    <summary><b>${esc(s.date)}</b> ${esc(s.dayName)}<div class="muted">${s.checkIn ? esc(fmtT(s.checkIn)) + " to " + esc(fmtT(s.checkOut)) + " · " + fmtDur(mins(s.checkIn, s.checkOut)) + " · " : ""}${esc(s.completed)} exercises</div></summary>
    ${s.entries.filter(e => e.sets.some(x => x.w || x.r || x.done) || e.note).map(e => `<div class="hist"><span>${esc(e.name)}${e.note ? `<br><small class="muted">📝 ${esc(e.note)}</small>` : ""}</span><span>${
      e.cardio ? "done" : e.sets.filter(x => x.w || x.r).map(x => esc(x.w || 0) + " x " + esc(x.r || 0)).join(", ")}</span></div>`).join("")}
    <div class="grid2"><label class="muted">Checked in<input type="time" value="${esc(s.checkIn || "")}" data-hin="${s.id}"></label><label class="muted">Checked out<input type="time" value="${esc(s.checkOut || "")}" data-hout="${s.id}"></label></div>
    <button class="xs danger" style="margin-top:10px" data-del="${s.id}">Delete workout</button></details>`).join("");
}

function chart(pts){
  if (pts.length < 2) return `<div class="muted" style="padding:8px 0">Log this exercise at least twice to see the chart.</div>`;
  const W = 320, H = 160, P = 30, ys = pts.map(p => p.w);
  let mn = Math.min(...ys), mx = Math.max(...ys); if (mn === mx){ mn -= 5; mx += 5; }
  const x = i => P + i * (W - P - 10) / (pts.length - 1), y = v => H - 20 - (v - mn) * (H - 40) / (mx - mn);
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p.w).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
    <text x="0" y="${y(mx) + 4}">${mx}</text><text x="0" y="${y(mn) + 4}">${mn}</text>
    <path d="${d}" fill="none" stroke="url(#g)" stroke-width="3"/>${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="4" fill="#5eead4"/>`).join("")}</svg>`;
}
function renderProgress(){
  const names = [...new Set(sorted().flatMap(s => s.entries.filter(e => !e.cardio && e.sets.some(x => parseFloat(x.w))).map(e => e.name)))];
  if (!names.length){ $("#view").innerHTML = `<div class="card muted">Log some weights and your progress charts will appear here.</div>`; return; }
  if (!names.includes(progEx)) progEx = names[0];
  const pts = sorted().map(s => {
    const e = s.entries.find(x => x.name === progEx); if (!e) return null;
    const ws = e.sets.map(x => parseFloat(x.w)).filter(v => !isNaN(v));
    return ws.length ? {date: s.date, w: Math.max(...ws), sets: e.sets.filter(x => x.w || x.r)} : null;
  }).filter(Boolean);
  $("#view").innerHTML = `<div class="card"><select id="progEx">${names.map(n => `<option ${n === progEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
    <div class="muted" style="margin-top:8px">Top set weight (${S.unit})</div>${chart(pts)}</div>
    <div class="card">${pts.slice().reverse().map(p => `<div class="hist"><span>${esc(p.date)}</span><span>${p.sets.map(x => esc(x.w || 0) + " x " + esc(x.r || 0)).join(", ")}</span></div>`).join("")}</div>`;
}

function renderPlan(){
  const p = S.program;
  let h = `<div class="card"><b>${esc(p.name)}</b><div class="muted">Starts ${esc(p.start)}. Use ↑ ↓ to reorder, ✕ to remove, or add your own exercises. Changes apply to your next workouts.</div></div>
    <div class="card"><h3>Weekly layout</h3>${(p.layout || []).map(l => `<div class="hist"><span>${esc(l[0])}</span><span>${esc(l[1])}</span></div>`).join("")}</div>
    <div class="card"><h3>Progression</h3>${(p.weeks || []).map(w => `<div style="padding:6px 0"><b>Week ${w.w}</b> <span class="muted">${esc(w.dates)}</span><div>${esc(w.focus)}</div></div>`).join("")}</div>`;
  p.days.forEach((d, di) => {
    h += `<div class="card" style="border-left:6px solid ${d.color || "#5eead4"}"><h3>${esc(d.name)} <span class="muted">${esc(d.when || "")}</span></h3>` +
      d.exercises.map((e, ei) => `<div class="hist"><span><a target="_blank" href="${formUrl(e.name)}">${esc(e.name)}</a> <small class="muted">${e.cardio ? "" : e.sets + " x "}${esc(e.reps)}</small>${e.alts && e.alts.length ? `<br><small class="muted">Alts: ${esc(e.alts.join(", "))}</small>` : ""}</span>
        <span class="tools"><button class="xs" data-pup="${di}:${ei}" ${ei ? "" : "disabled"}>↑</button><button class="xs" data-pdown="${di}:${ei}" ${ei < d.exercises.length - 1 ? "" : "disabled"}>↓</button><button class="xs danger" data-pdel="${di}:${ei}">✕</button></span></div>`).join("") +
      (planAdd === d.id
        ? `<div style="margin-top:10px"><input id="paName" list="exlist2" placeholder="Exercise name"><datalist id="exlist2">${allNames().map(x => `<option value="${esc(x)}">`).join("")}</datalist>
            <div class="grid2"><label class="muted">Sets<input id="paSets" type="number" inputmode="numeric" value="3"></label><label class="muted">Reps<input id="paReps" value="10"></label></div>
            <input id="paAlts" style="margin-top:8px" placeholder="Alternatives, separated by commas (optional)">
            <input id="paNote" style="margin-top:8px" placeholder="Form cue (optional)">
            <div class="row"><button class="primary sm" data-act="psave">Add to ${esc(d.name)}</button><button class="sm" data-act="pcancel">Cancel</button></div></div>`
        : `<button class="xs" style="margin-top:10px" data-padd="${d.id}">+ Add exercise</button>`) + `</div>`;
  });
  h += (p.notes || []).map(x => `<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`).join("");
  $("#view").innerHTML = h;
}

function renderSettings(){
  $("#view").innerHTML = `<div class="card"><h3>Units</h3><div class="row">
      <button class="${S.unit === "lb" ? "primary" : ""} sm" data-unit="lb">lb</button>
      <button class="${S.unit === "kg" ? "primary" : ""} sm" data-unit="kg">kg</button></div></div>
    <div class="card"><h3>Backup</h3><p class="muted">Your data lives on this phone only. Export a backup every week or two.</p>
      <div class="row"><button class="sm" data-act="export">Export backup</button>
      <label class="btn sm" style="padding:9px 13px">Import backup<input type="file" accept=".json,application/json" id="imp" hidden></label></div></div>
    <div class="card"><h3>Monthly program</h3><p class="muted">Paste a new program here each month and tap Save. Your history, notes, and charts are kept.</p>
      <textarea id="prog" rows="12" style="font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(S.program, null, 1))}</textarea>
      <div class="row"><button class="primary sm" data-act="saveprog">Save program</button><button class="sm" data-act="resetprog">Reset to Block 1</button></div></div>`;
}

async function exportData(){
  const name = "training-backup-" + todayISO() + ".json";
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
  const file = new File([blob], name, {type: "application/json"});
  if (navigator.canShare && navigator.canShare({files: [file]})){
    try { await navigator.share({files: [file]}); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

function render(){
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({home: renderHome, today: renderToday, history: renderHistory, progress: renderProgress, plan: renderPlan, settings: renderSettings})[tab]();
}

document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b){ tab = b.dataset.tab; render(); scrollTo(0,0); }
});
$("#gear").addEventListener("click", () => { tab = "settings"; render(); scrollTo(0,0); });

$("#view").addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.f && S.draft){ S.draft.entries[d.e].sets[d.s][d.f] = t.value; save(); }
  else if (d.note !== undefined){ if (t.value.trim()) S.notes[d.note] = t.value; else delete S.notes[d.note]; save(); }
  else if (d.ci && S.draft && t.value){ S.draft.checkIn = t.value; save(); const el = $("#elapsed"); if (el) el.textContent = fmtDur(mins(S.draft.checkIn, nowHM())); }
});

$("#view").addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (t.id === "progEx"){ progEx = t.value; render(); }
  else if (d.alt !== undefined && S.draft){
    const en = S.draft.entries[d.alt]; en.name = t.value; en.sets = fill(en.name, en.sets.length || 1); save(); render();
  }
  else if (d.hin || d.hout){
    const s = S.sessions.find(x => String(x.id) === (d.hin || d.hout));
    if (s){ if (d.hin) s.checkIn = t.value; else s.checkOut = t.value; save(); }
  }
  else if (t.id === "imp" && t.files[0]){
    t.files[0].text().then(txt => {
      try {
        const b = JSON.parse(txt); if (!b.program || !Array.isArray(b.sessions)) throw 0;
        if (confirm("Replace everything on this phone with this backup?")){ b.program.v = b.program.v || 2; b.notes = b.notes || {}; S = b; save(); render(); alert("Backup restored"); }
      } catch(err){ alert("That file is not a valid backup."); }
    });
  }
});

$("#view").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset, dr = S.draft;
  const ij = v => v.split(":").map(Number);
  if ("start" in d){ if (dr && !confirm("You already have a workout in progress. Replace it?")) return; startDay(d.start); }
  else if ("go" in d){ tab = d.go; render(); scrollTo(0,0); }
  else if ("done" in d){ const [i, j] = ij(d.done); const s = dr.entries[i].sets[j]; s.done = !s.done; save(); render(); }
  else if ("add" in d){ const en = dr.entries[d.add], prev = en.sets[en.sets.length - 1]; en.sets.push({w: prev ? prev.w : "", r: "", done: false}); save(); render(); }
  else if ("rm" in d){ dr.entries[d.rm].sets.pop(); save(); render(); }
  else if ("up" in d){ move(dr.entries, +d.up, +d.up - 1); save(); render(); }
  else if ("down" in d){ move(dr.entries, +d.down, +d.down + 1); save(); render(); }
  else if ("x" in d){ if (confirm("Remove " + dr.entries[d.x].name + " from today's workout?")){ dr.entries.splice(d.x, 1); save(); render(); } }
  else if ("pup" in d){ const [a, b] = ij(d.pup); move(S.program.days[a].exercises, b, b - 1); save(); render(); }
  else if ("pdown" in d){ const [a, b] = ij(d.pdown); move(S.program.days[a].exercises, b, b + 1); save(); render(); }
  else if ("pdel" in d){ const [a, b] = ij(d.pdel); const ex = S.program.days[a].exercises; if (confirm("Remove " + ex[b].name + " from " + S.program.days[a].name + "?")){ ex.splice(b, 1); save(); render(); } }
  else if ("padd" in d){ planAdd = d.padd; render(); }
  else if ("del" in d){ if (confirm("Delete this workout?")){ S.sessions = S.sessions.filter(x => String(x.id) !== d.del); save(); render(); } }
  else if ("unit" in d){ S.unit = d.unit; save(); render(); }
  else if (d.act === "cancel"){ if (confirm("Discard this workout?")){ S.draft = null; save(); render(); } }
  else if (d.act === "finish"){ if (confirm("Finish and check out now?")) finish(); }
  else if (d.act === "addopen"){ addOpen = true; render(); setTimeout(() => { const n = $("#nxName"); if (n) n.focus(); }, 50); }
  else if (d.act === "addcancel"){ addOpen = false; render(); }
  else if (d.act === "addex"){
    const name = $("#nxName").value.trim(); if (!name){ alert("Type an exercise name"); return; }
    const sets = Math.max(1, parseInt($("#nxSets").value) || 3), reps = $("#nxReps").value.trim() || "10";
    dr.entries.push({base: name, name, alts: [], target: sets + " x " + reps, note: "", cardio: false, sets: fill(name, sets)});
    if ($("#nxSave").checked){ const day = dayOf(dr.dayId); if (day) day.exercises.push({name, sets, reps, note: "", alts: []}); }
    addOpen = false; save(); render();
  }
  else if (d.act === "psave"){
    const name = $("#paName").value.trim(); if (!name){ alert("Type an exercise name"); return; }
    dayOf(planAdd).exercises.push({name, sets: Math.max(1, parseInt($("#paSets").value) || 3), reps: $("#paReps").value.trim() || "10",
      note: $("#paNote").value.trim(), alts: $("#paAlts").value.split(",").map(s => s.trim()).filter(Boolean)});
    planAdd = null; save(); render();
  }
  else if (d.act === "pcancel"){ planAdd = null; render(); }
  else if (d.act === "export") exportData();
  else if (d.act === "saveprog"){
    try {
      const p = JSON.parse($("#prog").value); if (!p.days || !p.start) throw 0;
      p.v = p.v || 2; S.program = p; S.draft = null; save(); alert("Program saved"); tab = "plan"; render();
    } catch(err){ alert("Could not read that program. Check the text you pasted."); }
  }
  else if (d.act === "resetprog"){ if (confirm("Reset the program to Block 1? History and notes are kept.")){ S.program = clone(DEFAULT_PROGRAM); save(); render(); } }
});

setInterval(() => {
  const c = $("#hclock"); if (c) c.textContent = clockStr();
  const dt = $("#hdate"); if (dt) dt.textContent = longDate();
  const el = $("#elapsed"); if (el && S.draft) el.textContent = fmtDur(mins(S.draft.checkIn, nowHM()));
}, 15000);

render();
</script>
</body>
</html>
